### Compila Lekto en cada plataforma y sube los instaladores como artefactos.
###
### Sirve para PROBAR en Windows/Linux sin instalar el toolchain en la máquina
### del autor: se descarga el .msi (o el .deb) desde la pestaña Actions.
###
### Tauri PURO: no hay package.json ni paso de build del frontend
### (`frontendDist` apunta a `../src`, que ya son los archivos finales).
###
### macOS va en un job aparte y MANUAL: el soporte de macOS está implementado pero
### todavía no se ha probado en un Mac, así que no se publica ningún .dmg. El job
### existe para producir el artefacto de prueba cuando haga falta
### (ver specs/macos_titlebar.md).

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      incluir_macos:
        description: "Compilar también en macOS (consume 10x minutos)"
        type: boolean
        default: false

jobs:
  # ── Escaneo de vulnerabilidades del árbol de dependencias ─────────────────────
  # POR QUÉ: un `cargo test` verde no dice NADA sobre CVEs conocidos en las
  # dependencias. Son dos preguntas distintas y hacen falta las dos.
  #
  # Corre SIN excepciones. Si alguna vez hace falta un --ignore, va acá con su razón
  # y su fecha escritas, y se revalida corriendo el comando SIN la excepción — no
  # releyendo por qué se puso. Una excepción justificada puede caducar sola cuando
  # el parche llega río arriba, y su justificación sigue leyéndose verdadera.
  auditoria:
    runs-on: ubuntu-22.04
    name: auditoría de dependencias
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            nombre: linux
          - os: windows-latest
            nombre: windows

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nombre }}

    steps:
      - uses: actions/checkout@v7

      # Dependencias de sistema de Tauri v2 (solo Linux).
      # webkit2gtk-4.1 es el de Tauri v2; el 4.0 era de v1.
      - name: dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --verbose

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los instaladores quedan descargables desde la pestaña Actions.
      - uses: actions/upload-artifact@v7
        with:
          name: lekto-${{ matrix.nombre }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.incluir_macos
    runs-on: macos-latest
    name: macos (manual)
    # Binario UNIVERSAL (Intel + Apple Silicon) en un solo .dmg.
    # `macos-latest` es Apple Silicon: un build por defecto NO corre en un Mac Intel,
    # y a distancia ese fallo es indistinguible de "la app está rota". Compilar los
    # dos arcos cuesta más minutos, pero elimina la pregunta "¿qué Mac tienes?" y
    # el diagnóstico ciego que vendría después.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
      - uses: actions/upload-artifact@v7
        with:
          name: lekto-macos
          if-no-files-found: error
          retention-days: 14
          # Con `--target`, el bundle NO queda en target/release sino bajo el triple.
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
